<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Moodboard Board Frame -->
      <rect x="36" y="36" width="184" height="184" rx="18" fill="#FFEBEF" stroke="#1A0508" stroke-width="10"/>
      <!-- Photo Card 1 (Tilted Left) -->
      <g transform="translate(56, 56)">
        <rect x="0" y="0" width="64" height="68" rx="6" fill="#FFFFFF" stroke="#C8102E" stroke-width="6"/>
        <circle cx="24" cy="24" r="8" fill="#FF3355"/>
        <path d="M4 52 L24 34 L44 48 L60 38 V64 H4 Z" fill="#FFEBEF"/>
      </g>
      <!-- Color Palette Chips -->
      <g transform="translate(136, 56)">
