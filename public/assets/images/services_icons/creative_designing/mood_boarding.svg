      <line x1="72" y1="162" x2="160" y2="162" stroke="#C8102E" stroke-width="6"/>
      <line x1="72" y1="178" x2="130" y2="178" stroke="#1A0508" stroke-width="6"/>
      <!-- Pin / Needle in Center -->
