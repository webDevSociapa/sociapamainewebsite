<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Smartphone Body -->
      <rect x="68" y="24" width="120" height="208" rx="24" fill="#FFEBEF" stroke="#1A0508" stroke-width="10"/>
      <!-- Phone Speaker -->
      <line x1="110" y1="44" x2="146" y2="44" stroke="#1A0508" stroke-width="6"/>
      <!-- Social Media Feed Post Card -->
      <rect x="84" y="64" width="88" height="92" rx="12" fill="#FFFFFF" stroke="#C8102E" stroke-width="6"/>
      <!-- Media Content Placeholder (Mountain / Sun) -->
      <path d="M84 126 L108 100 L128 118 L148 94 L172 120 V144 H84 Z" fill="#FFEBEF"/>
      <circle cx="106" cy="86" r="8" fill="#FF3355"/>
      <!-- Like Heart Reaction Bubble -->
      <g transform="translate(170, 110)">
        <circle cx="0" cy="0" r="28" fill="#C8102E"/>
        <path d="M0 6 C-14 -6, -20 -18, -10 -24 C-2 -28, 0 -18, 0 -18 C0 -18, 2 -28, 10 -24 C20 -18, 14 -6, 0 6 Z" transform="translate(0, 8) scale(0.9)" fill="#FFFFFF"/>
      </g>
      <!-- Engagement Bars -->
      <line x1="84" y1="172" x2="144" y2="172" stroke="#C8102E" stroke-width="6"/>
      <line x1="84" y1="188" x2="120" y2="188" stroke="#1A0508" stroke-width="6"/>
      <!-- Home Indicator -->
      <line x1="112" y1="214" x2="144" y2="214" stroke="#1A0508" stroke-width="6"/>
    </g>
  </svg>