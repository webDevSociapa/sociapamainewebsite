<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <linearGradient id="cdBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00A859"/>
        <stop offset="100%" stop-color="#006837"/>
      </linearGradient>
      <linearGradient id="balloonHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#E0FFE8" stop-opacity="0.9"/>
      </linearGradient>
      <linearGradient id="balloonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#70C042"/>
        <stop offset="100%" stop-color="#009245"/>
      </linearGradient>
    </defs>
    <rect width="512" height="512" rx="104" fill="url(#cdBg)"/>
    <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#70C042" stroke-width="16"/>
    <!-- CorelDRAW Hot Air Balloon -->
    <g transform="translate(256, 230)">
      <!-- Main Balloon Envelope -->
      <path d="M 0 -130 C 85 -130, 120 -60, 115 15 C 110 75, 50 115, 25 140 L -25 140 C -50 115, -110 75, -115 15 C -120 -60, -85 -130, 0 -130 Z" fill="url(#balloonGreen)" stroke="#FFFFFF" stroke-width="8"/>
      <!-- Inner Rib Left -->
      <path d="M 0 -130 C -45 -130, -75 -60, -70 15 C -65 75, -35 115, -15 140" fill="none" stroke="#FFFFFF" stroke-width="7"/>
      <!-- Inner Rib Right -->
      <path d="M 0 -130 C 45 -130, 75 -60, 70 15 C 65 75, 35 115, 15 140" fill="none" stroke="#FFFFFF" stroke-width="7"/>
      <!-- Center Gilded Segment -->
      <path d="M 0 -130 C -18 -80, -20 50, 0 140 C 20 50, 18 -80, 0 -130 Z" fill="url(#balloonHighlight)"/>
      <!-- Rigging lines & Burner -->
      <line x1="-22" y1="140" x2="-16" y2="162" stroke="#FFFFFF" stroke-width="6"/>
      <line x1="22" y1="140" x2="16" y2="162" stroke="#FFFFFF" stroke-width="6"/>
      <!-- Basket -->
      <rect x="-24" y="162" width="48" height="32" rx="6" fill="#FBB03B" stroke="#FFFFFF" stroke-width="5"/>
      <line x1="-12" y1="162" x2="-12" y2="194" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="12" y1="162" x2="12" y2="194" stroke="#FFFFFF" stroke-width="3"/>
    </g>
  </svg>