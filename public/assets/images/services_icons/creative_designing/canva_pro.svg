<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <linearGradient id="canvaBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00C4CC"/>
        <stop offset="45%" stop-color="#2D72D9"/>
        <stop offset="100%" stop-color="#7D2AE8"/>
      </linearGradient>
      <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFE066"/>
        <stop offset="100%" stop-color="#F59E0B"/>
      </linearGradient>
    </defs>
    <!-- Circular gradient background -->
    <circle cx="256" cy="256" r="236" fill="url(#canvaBg)"/>
    <circle cx="256" cy="256" r="236" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3"/>
    
    <!-- Canva Wordmark -->
    <text x="240" y="258" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="94" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">Canva</text>

    <!-- Golden Crown Badge "PRO" -->
    <g transform="translate(285, 305)">
      <rect x="0" y="15" width="180" height="80" rx="20" fill="#FBBF24" stroke="#FFFFFF" stroke-width="6"/>
      <!-- Mini Crown -->
      <path d="M 34 10 L 48 30 L 72 8 L 96 30 L 110 10 L 106 42 L 38 42 Z" fill="url(#crownGrad)" stroke="#B45309" stroke-width="2"/>
      <!-- Text 'PRO' -->
      <text x="90" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#1E293B" text-anchor="middle" letter-spacing="2">PRO</text>
    </g>
  </svg>