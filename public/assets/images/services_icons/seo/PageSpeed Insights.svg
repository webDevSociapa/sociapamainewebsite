<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
    <defs>
      <linearGradient id="psiWindowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#F1F3F4" />
      </linearGradient>
      <linearGradient id="psiArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1A73E8" />
        <stop offset="70%" stop-color="#1A73E8" />
        <stop offset="100%" stop-color="#A142F4" />
      </linearGradient>
      <filter id="psiShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" />
      </filter>
    </defs>
    <!-- Browser Card Window -->
    <rect x="6" y="8" width="88" height="84" rx="14" fill="url(#psiWindowGrad)" stroke="#DADCE0" stroke-width="2.5" filter="url(#psiShadow)" />
    <!-- Browser Top Bar -->
    <path d="M 6 22 L 6 22 A 14 14 0 0 1 20 8 L 80 8 A 14 14 0 0 1 94 22 L 6 22 Z" fill="#E8EAED" />
    <circle cx="16" cy="15" r="3" fill="#EA4335" />
    <circle cx="25" cy="15" r="3" fill="#FBBC05" />
    <circle cx="34" cy="15" r="3" fill="#34A853" />
    <!-- Speedometer Background Track -->
    <path d="M 22 76 A 32 32 0 1 1 78 76" fill="none" stroke="#E8EAED" stroke-width="11" stroke-linecap="round" />
    <!-- Speedometer Active Speed Arc -->
    <path d="M 22 76 A 32 32 0 0 1 68 44" fill="none" stroke="url(#psiArcGrad)" stroke-width="11" stroke-linecap="round" />
    <!-- Needle Center Hub -->
    <circle cx="50" cy="74" r="8" fill="#1A73E8" />
    <circle cx="50" cy="74" r="4" fill="#FFFFFF" />
    <!-- Needle Pointer -->
    <polygon points="47,70 53,70 72,48" fill="#1A73E8" />
  </svg>