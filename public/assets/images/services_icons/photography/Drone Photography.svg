        <circle cx="360" cy="80" r="45" fill="#FFEBEF" stroke="#C8102E" stroke-width="10"/>
        <line x1="325" y1="80" x2="395" y2="80" stroke="#1A0508" stroke-width="12"/>
        <circle cx="80" cy="360" r="45" fill="#FFEBEF" stroke="#C8102E" stroke-width="10"/>
        <line x1="45" y1="360" x2="115" y2="360" stroke="#1A0508" stroke-width="12"/>
