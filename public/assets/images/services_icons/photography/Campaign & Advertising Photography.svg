<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Billboard / Advertising Hoarding -->
    <rect x="36" y="44" width="184" height="124" rx="12" fill="#FFFFFF" stroke="#1A0508" stroke-width="8"/>
    <!-- Inner Advertising Visual -->
    <rect x="48" y="56" width="160" height="100" rx="6" fill="#FFEBEF"/>
    <!-- Mountain / Sun Visual Graphic -->
    <polygon points="64,136 104,88 136,124 160,100 192,136" fill="#FFEBEF" stroke="#D20C0C" stroke-width="6"/>
    <circle cx="92" cy="80" r="10" fill="#D20C0C"/>
    <!-- Billboard Pillars -->
    <line x1="84" y1="168" x2="84" y2="224" stroke="#1A0508" stroke-width="8"/>
    <line x1="172" y1="168" x2="172" y2="224" stroke="#1A0508" stroke-width="8"/>
    <!-- Spotlight Beams -->
    <polygon points="68,28 84,44 60,44" fill="#D20C0C"/>
    <polygon points="188,28 204,44 180,44" fill="#D20C0C"/>
